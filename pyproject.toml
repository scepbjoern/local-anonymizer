[project]
name = "local-anonymizer"
version = "0.2.0"
description = "Privacy-first local document and text anonymization pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gliner>=0.2.28",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.5",
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
]
gui = [
    "nicegui>=1.4.0",
    "pywebview>=5.0.0",
]
llm = [
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests requiring local model cache or downloads (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"

[tool.setuptools.package-data]
"local_anonymizer.llm" = ["catalog.json"]

